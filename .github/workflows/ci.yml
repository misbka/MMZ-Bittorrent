name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Renderer/main unit tests (vitest)
        run: npm test

      - name: Build bundles
        run: npm run build

  engine:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install libtorrent
        run: python -m pip install --upgrade pip libtorrent

      - name: Engine functional tests (real transfers)
        run: python -m unittest discover -s engine/tests -v
